[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yunan-backend"
version = "1.0.0"
description = "유난 — 반대편의 변호인: transactional multiplayer API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "firebase-admin>=6.5,<8",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["content/topics/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["emulator: needs running Firebase Auth and Firestore emulators"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python build.py"
